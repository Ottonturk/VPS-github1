name: CI/CD Pipeline

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  js-checks:
    name: Node.js Lint (Backend, Bot, Frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: |
          for dir in backend bot frontend; do
            if [ -f "$dir/package.json" ]; then
              cd "$dir"
              if [ -f package-lock.json ]; then npm ci; else npm install; fi
              npm run lint --if-present
              npm test --if-present
              cd ..
            fi
          done

  python-tests:
    name: Python Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install pytest
          for req in backend/requirements.txt bot/requirements.txt; do
            if [ -f "$req" ]; then pip install -r "$req"; fi
          done
          pytest || [ $? -eq 5 ]

  deploy:
    name: Build Images & Deploy to VPS
    needs: [js-checks, python-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push all service images
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          for service in backend bot frontend; do
            docker build -t ghcr.io/${REPO_LOWER}-${service}:latest ./${service}
            docker push ghcr.io/${REPO_LOWER}-${service}:latest
          done

      - name: Copy prod configs to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.prod.yml,proxy/Caddyfile"
          target: "/opt/my-app"

      - name: Restart containers on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/my-app
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
